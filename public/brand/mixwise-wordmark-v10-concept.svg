<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72" width="420" height="72" role="img" aria-label="mixwise wordmark concept">
  <!-- v10 concept: lowercase sans, lime accent on x upper-right stroke, sage wise half -->
  <text
    x="0"
    y="52"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="48"
    font-weight="700"
    letter-spacing="-0.02em"
    fill="#3A4D39"
  >mix</text>
  <!-- x: forest lower-left stroke -->
  <path
    d="M168 52 L184 28"
    stroke="#3A4D39"
    stroke-width="7"
    stroke-linecap="round"
  />
  <!-- x: lime upper-right stroke (brand identifier) -->
  <path
    d="M168 52 L192 20"
    stroke="#9ACD32"
    stroke-width="8"
    stroke-linecap="round"
  />
  <text
    x="200"
    y="52"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="48"
    font-weight="700"
    letter-spacing="-0.02em"
    fill="#5F6F5E"
  >wise</text>
</svg>
